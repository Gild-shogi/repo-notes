<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0f2a6e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS風: 余白付きの角丸スクエア -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- ノートカード（折り返し付き） -->
  <g filter="url(#shadow)">
    <path d="M 322 240
             h 290
             l 90 90
             v 454
             a 28 28 0 0 1 -28 28
             h -352
             a 28 28 0 0 1 -28 -28
             v -516
             a 28 28 0 0 1 28 -28
             z" fill="#ffffff"/>
    <path d="M 612 240 l 90 90 h -62 a 28 28 0 0 1 -28 -28 z" fill="url(#fold)"/>
  </g>

  <!-- Gitブランチ（リポジトリ単位のメモを象徴） -->
  <g stroke="#2563eb" stroke-width="26" fill="none" stroke-linecap="round">
    <path d="M 392 398 v 250"/>
    <path d="M 392 480 c 0 90 118 50 118 140"/>
  </g>
  <circle cx="392" cy="368" r="34" fill="#2563eb"/>
  <circle cx="392" cy="680" r="34" fill="#2563eb"/>
  <circle cx="510" cy="652" r="34" fill="#60a5fa"/>

  <!-- テキスト行 -->
  <g stroke="#cbd5e1" stroke-width="24" stroke-linecap="round">
    <line x1="576" y1="452" x2="668" y2="452"/>
    <line x1="576" y1="524" x2="668" y2="524"/>
    <line x1="576" y1="596" x2="640" y2="596"/>
  </g>
</svg>
