[package]
name = "repo-notes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "repo-notes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repo_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager"]

[[bin]]
name = "repo-notes"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "repo-notes-backend"
path = "src/backend_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = "0.22.1"
http = "1.4.2"
tauri-utils = { version = "2.9.3", default-features = false }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = "0.4"
dirs = "6"
notify = "8"
notify-debouncer-full = "0.5"
cap-std = "4.0.3"
percent-encoding = "2.3"
tauri-plugin-clipboard-manager = { version = "2.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"

